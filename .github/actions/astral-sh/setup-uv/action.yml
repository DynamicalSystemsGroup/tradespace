# The pin of astral-sh/setup-uv, outside the governed workflows (GOVERNANCE.md, "The secondary rules").
# One step and nothing else: scripts/release_checks.py pins holds this file to that shape.
name: astral-sh/setup-uv
description: astral-sh/setup-uv at its pinned commit, the inputs passed through.
inputs:
  version:
    description: The uv version to install; blank installs the action's choice.
    required: false
    default: ""
  python-version:
    description: The Python version uv uses; blank leaves it unset.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - id: action
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: ${{ inputs.version }}
        python-version: ${{ inputs.python-version }}
