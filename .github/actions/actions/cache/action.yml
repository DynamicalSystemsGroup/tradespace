# The pin of actions/cache, outside the governed workflows (GOVERNANCE.md, "The secondary rules").
# One step and nothing else: scripts/release_checks.py pins holds this file to that shape.
name: actions/cache
description: actions/cache at its pinned commit, the inputs passed through.
inputs:
  path:
    description: The paths to cache.
    required: true
  key:
    description: The cache key.
    required: true
runs:
  using: composite
  steps:
    - id: action
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
