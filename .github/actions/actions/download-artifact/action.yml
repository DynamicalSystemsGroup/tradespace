# The pin of actions/download-artifact, outside the governed workflows (GOVERNANCE.md, "The secondary rules").
# One step and nothing else: scripts/release_checks.py pins holds this file to that shape.
name: actions/download-artifact
description: actions/download-artifact at its pinned commit, the inputs passed through.
inputs:
  name:
    description: The artifact's name.
    required: true
  path:
    description: The destination; blank is the workspace.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - id: action
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
